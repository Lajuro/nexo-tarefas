# Mantém os scripts de cópia sem git (scripts/baixar-nexo.sh e
# scripts/nexo-offline.sh) sincronizados com o conteúdo da main.
name: Atualizar scripts de cópia

on:
  push:
    branches: [main]
    paths-ignore:
      - scripts/baixar-nexo.sh
      - scripts/nexo-offline.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripts-de-copia
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Se quem fez o push já gerou os scripts (o .githooks/pre-push cobra
      # isso), o carimbo confere e não há nada a fazer.
      - name: Conferir se os scripts estão em dia
        id: conferir
        run: |
          if bash scripts/gerar-scripts-de-copia.sh --check; then
            echo "em_dia=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar e publicar
        if: steps.conferir.outputs.em_dia != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/gerar-scripts-de-copia.sh --commit
          git push
